name: CI

on: [push, pull_request]

jobs:
  test:
    name: >
      Test Python ${{ matrix.python-version }},
      Django ${{ matrix.django-version }},
      Redis.py ${{ matrix.redis-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'
        django-version:
          - '5.2'
          - '6.0'
        redis-version:
          - 'latest'

        include:
          # Django 5.2 supports Python 3.10 & Python 3.11
          - python-version: '3.10'
            django-version: '5.2'
          - python-version: '3.11'
            django-version: '5.2'

          # Only test pre-release dependencies for the latest Python.
          # latest Django with pre-release redis
          - python-version: '3.14'
            django-version: '6.0'
            redis-version: 'master'

          # pre-release Django with latest redis
          - python-version: '3.14'
            django-version: 'main'
            redis-version: 'latest'

          # pre-release Django and pre-release redis
          - python-version: '3.14'
            django-version: 'main'
            redis-version: 'master'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-test-python-${{ matrix.python-version }}-django-${{ matrix.django-version }}-redis-${{ matrix.redis-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-test-python-${{ matrix.python-version }}-django-${{ matrix.django-version }}-redis-${{ matrix.redis-version }}
            pip-test-python-${{ matrix.python-version }}
            pip-test-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox-uv tox-gh

      - name: Docker compose up
        run: docker compose -f tests/compose.yml up --detach --wait

      - name: Tox tests
        run: tox
        env:
          DJANGO: ${{ matrix.django-version }}
          REDIS: ${{ matrix.redis-version }}

      - name: Docker compose down
        if: ${{ !cancelled() }}
        run: docker compose -f tests/compose.yml down

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          env_vars: DJANGO,REDIS,PYTHON
          flags: tests
        env:
          DJANGO: ${{ matrix.django-version }}
          REDIS: ${{ matrix.redis-version }}
          PYTHON: ${{ matrix.python-version }}

  lint:
    name: Lint (${{ matrix.tool }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tool:
          - 'pre-commit'
          - 'mypy'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-lint-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-lint-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox

      - name: Run ${{ matrix.tool }}
        run: tox -e ${{ matrix.tool }}

      - name: Upload coverage
        if: ${{ matrix.tool == 'mypy' }}
        uses: codecov/codecov-action@v7
        with:
          flags: mypy

  check-changelog:
    name: Check for news fragments in 'changelog.d/'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-check-changelog-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-check-changelog-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade towncrier

      - name: Run towncrier check
        run: |
          if ! towncrier check; then
            echo ''
            echo "Please add a description of your changes to 'changelog.d/{issue or PR number}.{feature,bugfix,misc,doc,removal}'"
            exit 1
          fi
